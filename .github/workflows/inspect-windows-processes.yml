name: Inspect native Windows installer process checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
      - name: Time native and emulated PowerShell process checks
        shell: bash
        run: |
          node <<'JS'
          const {execFile}=require('node:child_process'),{promisify}=require('node:util'),{join}=require('node:path');
          (async()=>{for(const directory of ['System32','SysWOW64'])for(const command of [
            "if (Get-Command Get-CimInstance -ErrorAction SilentlyContinue) { exit 0 } else { exit 1 }",
            "Write-Output (Get-ExecutionPolicy -Scope Process)",
            "Write-Output (Get-CimInstance -ClassName Win32_Process).Count"
          ]){const file=join(process.env.WINDIR,directory,'WindowsPowerShell/v1.0/powershell.exe'),start=Date.now();
            console.log('Checking '+directory+': '+command);
            try{const r=await promisify(execFile)(file,['-NoProfile','-NonInteractive','-C',command],{windowsHide:true,timeout:20000,maxBuffer:4096});console.log(JSON.stringify({directory,elapsed:Date.now()-start,stdout:r.stdout,stderr:r.stderr}));}
            catch(e){console.log(JSON.stringify({directory,elapsed:Date.now()-start,error:e.message,stdout:e.stdout,stderr:e.stderr}));}
          }})();
          JS
